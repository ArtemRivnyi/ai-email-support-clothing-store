{{- if .Values.ollama.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-email-support.fullname" . }}-ollama
  labels:
    app: {{ include "ai-email-support.fullname" . }}-ollama
spec:
  replicas: {{ .Values.ollama.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ai-email-support.fullname" . }}-ollama
  template:
    metadata:
      labels:
        app: {{ include "ai-email-support.fullname" . }}-ollama
    spec:
      containers:
      - name: ollama
        image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
        imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.ollama.service.port }}
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        resources:
          {{- toYaml .Values.ollama.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.ollama.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: {{ include "ai-email-support.fullname" . }}-ollama-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-email-support.fullname" . }}-ollama
  labels:
    app: {{ include "ai-email-support.fullname" . }}-ollama
spec:
  type: ClusterIP
  selector:
    app: {{ include "ai-email-support.fullname" . }}-ollama
  ports:
  - port: {{ .Values.ollama.service.port }}
    targetPort: {{ .Values.ollama.service.port }}
    protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-email-support.fullname" . }}-ollama-pvc
spec:
  accessModes:
    - {{ .Values.ollama.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.storage }}
{{- end }}
