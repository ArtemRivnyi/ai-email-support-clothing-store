apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-email-support.fullname" . }}-secrets
type: Opaque
stringData:
  GEMINI_API_KEY: "{{ .Values.secret.geminiApiKey }}"
  OPENAI_API_KEY: "{{ .Values.secret.openaiApiKey }}"
  MASTER_API_KEY: "{{ .Values.secret.masterApiKey }}"
  JWT_SECRET: "{{ .Values.secret.jwtSecret }}"
