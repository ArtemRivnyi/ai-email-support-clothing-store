name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    - name: Lint with Pylint
      run: |
        pip install pylint
        pylint worker.py api/app.py services/*.py || true
    - name: Run Unit Tests
      run: |
        python -m pytest tests/unit/ --cov=services --cov-report=xml
    - name: Run Integration Tests
      run: |
        python -m pytest tests/integration/
    - name: Setup Helm
      uses: azure/setup-helm@v4.2.0
      with:
        version: v3.14.0
    - name: Lint Helm Chart
      run: helm lint k8s/ai-email-support

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run Bandit
      run: |
        pip install bandit
        bandit -r . -ll
    # - name: Run Trivy (Filesystem)
    #   uses: aquasecurity/trivy-action@master
    #   with:
    #     scan-type: 'fs'
    #     scan-ref: '.'

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push API
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-email-api:latest,${{ secrets.DOCKERHUB_USERNAME }}/ai-email-api:${{ github.sha }}
    # Repeat for worker and dashboard...

